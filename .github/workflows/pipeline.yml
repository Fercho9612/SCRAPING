name: CI Pipeline - Scraping Exito

on:
  push:
    branches: [ "main", "master", "desarrollo" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

jobs:
  test-and-run:
    runs-on: ubuntu-24.04

    env:
      ML_VENV_OK: "1"

    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout del código
        uses: actions/checkout@v5

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas automatizadas (scraper y API)
        run: python -m pytest tests -vv --tb=short

      - name: Validar sintaxis y compilación de los scripts
        run: |
          python -m py_compile src/SCRAPING.py
          python -m py_compile src/app.py

      # El scraper solo corre manualmente: Cloudflare puede bloquearlo en GitHub Actions
      - name: Ejecutar scraper (manual y opcional)
        if: github.event_name == 'workflow_dispatch' && matrix.python-version == '3.11'
        continue-on-error: true
        run: python src/SCRAPING.py

      - name: Guardar resultados y diagnósticos como artefactos
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: resultados-scraping-py${{ matrix.python-version }}
          path: |
            data/*.csv
            data/*.png
            data/*.html
            *.png
            *.html
          if-no-files-found: warn