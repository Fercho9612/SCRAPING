
name: CI Pipeline - Scraping Éxito.

on:
  push:
    branches: [ "main", "master", "desarrollo" ]
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub cuando quieras

jobs:
  test-and-run:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"] # Matriz para probar en ambas versiones

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Instalar el navegador según el valor de la matriz

      - name: Instalar Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas automatizadas
        run: python -m pytest tests -v

      - name: Validar sintaxis y compilación del script
        run: python -m py_compile src/SCRAPING.py

      - name: (Opcional) Ejecutar el Scraper de Exito
        run: python src/SCRAPING.py

      # Exportan automáticamente como Artifacts en GitHub Actions.
      # Entrega diagnósticos, capturas de pantalla y archivos generados.

      - name: Guardar resultados y diagnósticos como artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-scraping-py${{ matrix.python-version }}
          path: |
            data/*.csv
            data/*.png
            data/*.html
            *.png
            *.html
          if-no-files-found: warn
