name: CI Pipeline - Scraping ML (Ligero)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub cuando quieras

jobs:
  test-and-run:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"] # Matriz para probar en ambas versiones

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas selenium nltk pysentimiento

      - name: Validar sintaxis y compilación del script
        run: python -m py_compile src/SCRAPING.py

      - name: (Opcional) Ejecutar el Scraper de Mercado Libre
        run: python src/SCRAPING.py

#Exportan automáticamente como Artifacts en GitHub Actions.
  #Entrega diagnóstico, captura pantallas y archivos y los reportes generados
      - name: Guardar resultados y diagnósticos como artefactos
        uses: actions/upload-artifact@v4
        with:
          name: resultados-scraping-py${{ matrix.python-version }}
          path: |
            *.csv
            *.png
            *.html